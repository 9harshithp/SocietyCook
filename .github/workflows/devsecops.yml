name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, enterprise-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security-and-quality:
    name: Security Scan, Lint & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: societycook
          MYSQL_USER: societycook
          MYSQL_PASSWORD: localpassword
          MYSQL_ROOT_PASSWORD: localrootpassword
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -plocalrootpassword" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Audit Backend Dependencies (OWASP Top 10 A06)
        run: npm --prefix backend audit --audit-level=high

      - name: Audit Frontend Dependencies (OWASP Top 10 A06)
        run: npm --prefix frontend audit --audit-level=high

      - name: Initialize Database & Seed Fixtures for CI Tests
        run: |
          cd backend
          node seed.js
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://societycook:localpassword@127.0.0.1:3307/societycook

      - name: Execute Backend Tests & Security Regression Suite
        run: npm --prefix backend test
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://societycook:localpassword@127.0.0.1:3307/societycook
          JWT_SECRET: test-super-secret-jwt-key-minimum-32-chars-ok

      - name: Build Frontend Production Bundle
        run: npm --prefix frontend run build

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Repo & Config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          npx -y @cyclonedx/cyclonedx-npm --output-file backend-bom.json --package-lock-only backend/package-lock.json || true
          npx -y @cyclonedx/cyclonedx-npm --output-file frontend-bom.json --package-lock-only frontend/package-lock.json || true

